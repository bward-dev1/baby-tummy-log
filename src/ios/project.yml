name: AetherEMU

options:
  bundleIdPrefix: dev.aetheremu
  deploymentTarget:
    iOS: '16.0'
  xcodeVersion: '16.0'

settings:
  PRODUCT_NAME: AetherEMU
  SDKROOT: iphoneos
  IPHONEOS_DEPLOYMENT_TARGET: '16.0'
  CODE_SIGN_IDENTITY: iPhone Developer
  CODE_SIGN_ENTITLEMENTS: AetherEMU.entitlements
  SWIFT_OBJC_BRIDGING_HEADER: Bridge/AetherEMU-Bridging-Header.h
  CLANG_ENABLE_MODULES: 'YES'
  CLANG_ENABLE_OBJC_ARC: 'YES'
  # The core headers AetherBridge.mm/emu_window.mm include use C++20 (concepts/requires,
  # std::span) -- CMakeLists.txt sets CMAKE_CXX_STANDARD 20 for the CMake build, but
  # Xcode compiles these files itself (see the HEADER_SEARCH_PATHS comment below) and
  # defaults to an older standard, which fails with errors like "no template named
  # 'span' in namespace 'std'" and "unknown type name 'requires'" -- a real CI failure
  # this caught.
  CLANG_CXX_LANGUAGE_STANDARD: 'gnu++20'
  # AetherBridge.mm includes core/core.h etc. directly -- these need to resolve the
  # same way they do for the CMake build (top-level CMakeLists.txt / src/*/CMakeLists.txt
  # target_include_directories), since Xcode compiles this file itself rather than
  # through CMake.
  HEADER_SEARCH_PATHS:
    - '$(SRCROOT)/..'
    # CPMUtil.cmake's AddPackage flow passes an explicit SOURCE_DIR already under
    # .cache/cpm/... into FetchContent_Declare, so CPM-managed packages never land under
    # the default <binary_dir>/_deps/<name>-src path -- confirmed by reading that CMake
    # logic, not guessed (there is no build/_deps/boost-src to find).
    - '$(SRCROOT)/../../.cache/cpm/boost/**'
    # The recursive glob above found libs/unordered (confirmed present in a failed
    # build's actual -I list) but NOT libs/unordered/include specifically, even though
    # other libraries' /include subdirectories were found fine -- and the CMake "Build"
    # step (Boost::headers, a real umbrella INTERFACE target) successfully compiles
    # common/container/unordered_map.h's `#include <boost/unordered/unordered_flat_map.hpp>`
    # from this exact checkout, so the file does exist on disk; this is an Xcode/xcodegen
    # glob-expansion gap for this one library, not a missing submodule. Added explicitly
    # rather than trying to guess a different recursive-glob shape that might have the
    # same gap for some other library.
    - '$(SRCROOT)/../../.cache/cpm/boost/boost-*/libs/unordered/include'
    # `boost` and `boost_headers` (CMakeLists.txt's fallback for when Boost::headers
    # isn't available via CPM, see its "really annoying" comment) are separate CPM
    # packages, cached under separate directories keyed by package name.
    - '$(SRCROOT)/../../.cache/cpm/boost_headers/**'
  # Static libs already built by `cmake --build build --config Release` (core,
  # video_core, audio_core, aetheremu-ios, every bundled CPM dependency) -- see
  # ci/generate-link-flags.sh's header comment for why full paths in a response file
  # rather than -l<name> + LIBRARY_SEARCH_PATHS.
  OTHER_LDFLAGS: '@$(SRCROOT)/link-flags.txt $(inherited) -lc++'
  GENERATE_INFOPLIST_FILE: 'YES'
  INFOPLIST_FILE: 'Info-Extra.plist'
  MARKETING_VERSION: '0.1.0'
  CURRENT_PROJECT_VERSION: '1'
  INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
  INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  # Placeholder icon (a generated "A" wordmark over a galaxy background) so the app has
  # something other than the default blank-icon slot -- swap the source in
  # AetherEMU/Assets.xcassets/AppIcon.appiconset when a real one is ready. Single-size
  # (1024x1024 "universal" idiom) app icon, the modern Xcode 14+ format that skips the
  # old full per-size icon set.
  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  AetherEMU:
    type: application
    platform: iOS
    deploymentTarget: '16.0'

    sources:
      - path: AetherEMU
        type: group
      - path: Bridge
        type: group

    preBuildScripts:
      - name: Generate linker response file for CMake-built libs
        script: |
          "$SRCROOT/../../ci/generate-link-flags.sh" "$SRCROOT/link-flags.txt"
        outputFiles:
          - "$SRCROOT/link-flags.txt"

    scheme:
      gatherCoverageData: false
