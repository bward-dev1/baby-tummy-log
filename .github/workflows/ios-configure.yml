name: iOS configure

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  configure-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode / SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install host build tools
        run: brew install glslang

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          # An adversarial review pass caught this: CMakeLists.txt sets CPM_SOURCE_CACHE
          # to ${CMAKE_SOURCE_DIR}/.cache/cpm (repo-relative, lowercase -- confirmed
          # against CPMUtil.cmake's own default), not ~/.cache/CPM (home dir, uppercase).
          # This key was a guaranteed cache miss on every run: nothing was ever restored
          # or saved, so every dependency (boost/openssl-ci/fmt/moltenvk-ios/...) was
          # re-downloaded from scratch each time -- silently, with no visible error, since
          # a full cold build still succeeds. Doesn't affect correctness, only CI speed.
          path: .cache/cpm
          key: cpm-ios-${{ hashFiles('cpmfile.json') }}

      - name: Configure (core only, no app target yet)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DENABLE_QT=OFF \
            -DYUZU_CMD=OFF \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_LIBUSB=OFF \
            -DYUZU_ROOM=OFF

      - name: Upload CMake logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project for the app target
        run: |
          cd src/ios
          xcodegen generate

      - name: Build app target (unsigned)
        run: |
          set -o pipefail
          cd src/ios
          xcodebuild -project AetherEMU.xcodeproj -scheme AetherEMU \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ../../app-build.log

      - name: Upload app build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-log
          path: app-build.log

      - name: Package unsigned .app as an .ipa-shaped zip
        run: |
          set -euo pipefail
          APP_PATH=$(find src/ios/build -maxdepth 6 -name "AetherEMU.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::AetherEMU.app not found under src/ios/build -- build succeeded but product is missing"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p ipa-out/Payload
          cp -R "$APP_PATH" ipa-out/Payload/
          cd ipa-out
          zip -r ../AetherEMU-unsigned.ipa Payload
          cd ..
          echo "Wrote AetherEMU-unsigned.ipa ($(du -h AetherEMU-unsigned.ipa | cut -f1))"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherEMU-unsigned-ipa
          path: AetherEMU-unsigned.ipa
          retention-days: 14
